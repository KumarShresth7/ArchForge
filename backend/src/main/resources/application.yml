server:
  port: 8000

spring:
  application:
    name: archforge-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./archforge.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

archforge:
  auth:
    secret: ${AUTH_SECRET:${NEXTAUTH_SECRET:dev-secret-change-in-production}}
    expiration-hours: 2
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    url: https://api.groq.com/openai/v1/chat/completions
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
